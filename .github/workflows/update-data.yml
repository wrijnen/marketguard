name: Update Pages market data

on:
  schedule:
    - cron: '*/5 13-22 * * 1-5'   # every 5 min on weekdays ~09:00-17:00 ET / 15:00-23:00 CET (UTC hours 13-22)
    - cron: '*/30 * * * *'        # every 30 min otherwise
  workflow_dispatch:
  push:
    branches: [vibe/stoploss-dashboard-fef2f6]   # refresh data on code pushes too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app code (default branch)
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout gh-pages branch (site)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Export market data into site/data
        run: node app/server/export.js --out site/data

      - name: Commit and push data to gh-pages
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(pages): update market data $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "no data changes"
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin gh-pages
